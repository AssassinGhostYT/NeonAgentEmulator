name: 🤖 Build & Release Neon Agent Emulator APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Preparar Gradle Wrapper
        run: |
          chmod +x gradlew

      - name: 🚀 Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace --info

      - name: 📦 Guardar APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NeonAgentEmulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
